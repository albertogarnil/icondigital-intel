<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Contacto · Intel Digital</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body data-page="contacto">
<div id="site-header"></div>

<main data-no-footcta>
  <section class="talk" data-nav-solid>
    <div class="talk-bg" aria-hidden="true"><img src="img/taza.jpg" alt=""></div>
    <div class="wrap">
      <form class="talk-card" data-form="Prototipo: en la web real aquí se enviaría tu mensaje." novalidate>
        <h1>Hablemos</h1>
        <p class="lead">¿Tienes alguna duda o quieres conocer mejor nuestros productos y servicios? Déjanos tus datos y nuestro equipo se pondrá en contacto contigo.</p>
        <div class="fields">
          <label class="f full"><input id="h-name" placeholder=" " required autocomplete="name"><span>Nombre y apellidos*</span></label>
          <label class="f"><input id="h-email" type="email" placeholder=" " required autocomplete="email"><span>Email*</span></label>
          <label class="f"><input id="h-tel" type="tel" placeholder=" " autocomplete="tel"><span>Teléfono</span></label>
          <label class="f"><input id="h-city" placeholder=" " autocomplete="address-level2"><span>Ciudad</span></label>
          <label class="f"><select id="h-serv" required><option value="">Seleccionar</option><option>Conectividad y Movilidad</option><option>Puesto de Trabajo</option><option>Comunicaciones</option><option>Soluciones Digitales</option><option>Ciberseguridad</option><option>Otro</option></select><span>Servicio de interés*</span><svg class="chev" viewBox="0 0 12 12"><path d="m2 4 4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></label>
          <label class="f full"><textarea id="h-msg" placeholder=" " rows="3"></textarea><span>Mensaje</span></label>
        </div>
        <label class="check"><input type="checkbox" id="h-legal" required>He leído y acepto las condiciones legales y la política de privacidad</label>
        <div class="form-foot"><button class="btn btn-primary" type="submit">Enviar<span class="arr" aria-hidden="true"></span></button><span class="form-msg" role="status"></span></div>
        <div class="talk-lines">
          <span class="contact-line"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>+34 916 867 514</span>
          <span class="contact-line"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>info@empresa.com</span>
        </div>
      </form>
    </div>
  </section>
</main>

<div id="site-footer"></div>
<script src="assets/app.js"></script>
</body>
</html>
